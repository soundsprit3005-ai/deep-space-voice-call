name: Build Deep Space APK

on:
workflow_dispatch:
push:
branches:
- main
- master

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: "8.9"

  - name: Verify diagnostic ZIP
    run: |
      ZIP="Deep_Space_Voice_Call_Source_Diagnostic_v3.zip"
      test -f "$ZIP"
      unzip -t "$ZIP"

  - name: Extract Android source
    run: |
      unzip -q Deep_Space_Voice_Call_Source_Diagnostic_v3.zip -d extracted
      test -f extracted/ScreenOnCall/settings.gradle.kts
      test -f extracted/ScreenOnCall/app/build.gradle.kts
      test -f extracted/ScreenOnCall/app/src/main/java/com/screenoncall/MainActivity.kt

  - name: Configure signaling server
    run: |
      APP="extracted/ScreenOnCall/app/src/main/java/com/screenoncall/MainActivity.kt"
      sed -i 's#wss://YOUR-SIGNALING-SERVER.example/ws#wss://deep-space-voice-call.onrender.com/ws#g' "$APP"
      grep -F 'wss://deep-space-voice-call.onrender.com/ws' "$APP"

  - name: Configure WebRTC dependency
    run: |
      APP="extracted/ScreenOnCall/app/build.gradle.kts"
      sed -i 's#org.webrtc:google-webrtc:1.0.32006#io.github.webrtc-sdk:android:150.7871.01#' "$APP"
      grep -F 'io.github.webrtc-sdk:android:150.7871.01' "$APP"

  - name: Build diagnostic APK
    run: |
      gradle --no-daemon \
        -p extracted/ScreenOnCall \
        assembleDebug

  - name: Verify APK
    run: |
      APK="extracted/ScreenOnCall/app/build/outputs/apk/debug/app-debug.apk"
      test -s "$APK"
      ls -lh "$APK"

  - name: Upload diagnostic APK
    uses: actions/upload-artifact@v4
    with:
      name: DEEP-SPACE-APK-DIAGNOSTIC
      path: extracted/ScreenOnCall/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
