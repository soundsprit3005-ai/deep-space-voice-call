
name: Build Deep Space APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract source ZIP
        run: |
          unzip -q Deep_Space_Voice_Call_Source.zip -d extracted
          test -f extracted/ScreenOnCall/settings.gradle.kts

      - name: Build APK
        run: |
          gradle --no-daemon \
            -p extracted/ScreenOnCall \
            assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DEEP-SPACE-APK
          path: extracted/ScreenOnCall/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
